<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APMS — {% block page_title %}Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}" />
</head>

<body data-page="{% block page_id %}dashboard{% endblock %}">
  <div class="app-wrapper">
    <div class="shell">

      {% include 'student/components/sidebar.html' %}

      <div class="main">
        <div class="topbar">
          <div class="tb-left">
            <div class="tb-titles">
              <div class="tb-title">{% block topbar_title %}Dashboard{% endblock %}</div>
              <div class="tb-sub" id="tbSub">Loading…</div>
            </div>
          </div>
          <div class="tb-right">
            <div class="tb-profile-btn" onclick="window.location.href='/student/profile'" title="My Profile">
              {{ session.avatar_initials }}
            </div>
            <div class="tb-notif" onclick="window.location.href='/student/notifs'" title="Notifications">
              <span class="material-symbols-outlined icon-inline">notifications</span>
              <div class="tb-notif-dot"></div>
            </div>
            <div class="tb-logo">APMS</div>
          </div>
        </div>

        <div class="content-area">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

    {% include 'student/components/footer.html' %}
  </div>

  <script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
  <script>
  (function () {
    fetch('/student/api/topbar-info')
      .then(r => r.json())
      .then(d => {
        var el = document.getElementById('tbSub');
        if (!el) return;
        var year = d.academic_year ? ' · Semester ' + d.academic_year : '';
        el.textContent = (d.course_code || 'COMP4200') + year;
      })
      .catch(() => {
        var el = document.getElementById('tbSub');
        if (el) el.textContent = 'COMP4200';
      });
  })();
  </script>
</body>
</html>
